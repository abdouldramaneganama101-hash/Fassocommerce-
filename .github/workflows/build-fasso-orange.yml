name: Fasso Commerce - APK ORANGE FINAL

on:
  workflow_dispatch:

jobs:
  build:
    name: Construire Fasso Commerce Orange
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Installer Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Trouver UNIQUEMENT le nouveau ZIP orange
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Fasso-Commerce-MODELE-ORANGE-REFERENCE-1.zip"

          echo "Recherche du fichier : $ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERREUR : le nouveau ZIP orange est introuvable."
            echo "Voici les ZIP presents dans le depot :"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Nouveau ZIP orange trouve."

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

      - name: Verifier la structure du nouveau projet
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android-project/settings.gradle.kts ]; then
            ROOT="$(find android-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"

            if [ -n "$ROOT" ] && [ -f "$ROOT/settings.gradle.kts" ]; then
              cp -a "$ROOT"/. android-project/
            fi
          fi

          test -f android-project/settings.gradle.kts
          test -f android-project/build.gradle.kts
          test -f android-project/app/build.gradle.kts
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/app/src/main/java/com/fassocommerce/MainActivity.java

          echo "Structure Android correcte."

      - name: Verifier le MODELE ORANGE
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail

          echo "Verification du logo..."
          test -f app/src/main/res/drawable/fasso_logo_orange.png

          echo "Verification des photos..."
          test -f app/src/main/res/drawable/tondeuse.png
          test -f app/src/main/res/drawable/fer_repasser.png
          test -f app/src/main/res/drawable/aspirateur_voiture.png
          test -f app/src/main/res/drawable/compresseur.png
          test -f app/src/main/res/drawable/outillage.png

          echo "Verification de la nouvelle interface..."
          grep -q "fasso_logo_orange" app/src/main/java/com/fassocommerce/MainActivity.java
          grep -q "255,102,0" app/src/main/java/com/fassocommerce/MainActivity.java
          grep -q "Top ventes" app/src/main/java/com/fassocommerce/MainActivity.java
          grep -q "Demander un devis" app/src/main/java/com/fassocommerce/MainActivity.java
          grep -q "Livraison" app/src/main/java/com/fassocommerce/MainActivity.java

          echo "Verification de suppression de l'ancien modele..."
          if grep -q "PUBLICITÉ" app/src/main/java/com/fassocommerce/MainActivity.java; then
            echo "ERREUR : ancien bandeau PUBLICITE detecte."
            exit 1
          fi

          if grep -q "OFFRE SPÉCIALE" app/src/main/java/com/fassocommerce/MainActivity.java; then
            echo "ERREUR : ancien bandeau OFFRE SPECIALE detecte."
            exit 1
          fi

          if grep -q -- "-20%" app/src/main/java/com/fassocommerce/MainActivity.java; then
            echo "ERREUR : ancien texte -20% detecte."
            exit 1
          fi

          if grep -q "sur votre première commande" app/src/main/java/com/fassocommerce/MainActivity.java; then
            echo "ERREUR : ancien texte Livraison detecte."
            exit 1
          fi

          echo "MODELE ORANGE VERIFIE."

      - name: Installer Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Afficher les versions
        working-directory: android-project
        run: |
          java -version
          gradle --version

      - name: Nettoyer le projet
        working-directory: android-project
        run: |
          gradle clean --no-daemon

      - name: Compiler UNIQUEMENT le nouveau modele
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verifier APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK genere :"
          ls -lh "$APK"

          echo "Verification du contenu APK..."

          unzip -l "$APK" | grep -q "fasso_logo_orange"
          unzip -l "$APK" | grep -q "tondeuse"
          unzip -l "$APK" | grep -q "fer_repasser"
          unzip -l "$APK" | grep -q "aspirateur_voiture"
          unzip -l "$APK" | grep -q "compresseur"

          echo "LOGO ET PHOTOS PRESENTS DANS L APK."

      - name: Publier APK ORANGE FINAL
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-ORANGE-FINAL-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
