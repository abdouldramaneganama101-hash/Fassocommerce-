name: Fasso Commerce - ORANGE FINAL

on:
  workflow_dispatch:

jobs:
  build:
    name: Construire Fasso Commerce Orange
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Installer Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Selectionner UNIQUEMENT le nouveau ZIP ORANGE corrige
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche du ZIP ORANGE corrige..."

          ZIP="$(find . -maxdepth 1 -type f \
            -iname 'Fasso-Commerce-ORANGE-CORRIGE-COMPILATION*.zip' \
            -print | sort -V | tail -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERREUR : le ZIP ORANGE corrige est introuvable."
            echo ""
            echo "ZIP disponibles dans le depot :"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "========================================"
          echo "ZIP SELECTIONNE :"
          echo "$ZIP"
          echo "========================================"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo "ZIP ORANGE decompresse."

      - name: Trouver la racine Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f android-project/settings.gradle.kts ]; then
            echo "Projet Android directement a la racine du ZIP."
          else
            ROOT="$(find android-project -mindepth 1 -maxdepth 1 -type d \
              -exec test -f '{}/settings.gradle.kts' \; -print | head -n 1)"

            if [ -z "$ROOT" ]; then
              echo "ERREUR : impossible de trouver settings.gradle.kts."
              find android-project -maxdepth 3 -type f -print
              exit 1
            fi

            echo "Racine Android trouvee : $ROOT"

            TEMP_DIR="android-project-temp"
            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            cp -a "$ROOT"/. "$TEMP_DIR"/

            rm -rf android-project
            mv "$TEMP_DIR" android-project
          fi

      - name: Verifier le projet ORANGE
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail

          echo "Verification des fichiers Android..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/fassocommerce/MainActivity.java
          test -f app/src/main/java/com/fassocommerce/AdminActivity.java
          test -f app/src/main/java/com/fassocommerce/ProductStore.java
          test -f app/src/main/java/com/fassocommerce/OrderStore.java

          echo "Verification du logo..."
          test -f app/src/main/res/drawable/fasso_logo_orange.png

          echo "Verification des produits..."
          test -f app/src/main/res/drawable/tondeuse.png
          test -f app/src/main/res/drawable/fer_repasser.png
          test -f app/src/main/res/drawable/aspirateur_voiture.png
          test -f app/src/main/res/drawable/compresseur.png
          test -f app/src/main/res/drawable/outillage.png

          echo "Tous les fichiers necessaires sont presents."

      - name: Verifier que l ancien modele est absent
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail

          MAIN="app/src/main/java/com/fassocommerce/MainActivity.java"

          if grep -q "OFFRE SPÉCIALE" "$MAIN"; then
            echo "ERREUR : ancien texte OFFRE SPECIALE detecte."
            exit 1
          fi

          if grep -q -- "-20%" "$MAIN"; then
            echo "ERREUR : ancien texte -20% detecte."
            exit 1
          fi

          if grep -q "sur votre première commande" "$MAIN"; then
            echo "ERREUR : ancien texte de livraison detecte."
            exit 1
          fi

          echo "Ancien modele non detecte."

      - name: Installer Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Afficher les versions
        run: |
          java -version
          gradle --version

      - name: Nettoyer le projet
        working-directory: android-project
        run: |
          gradle clean --no-daemon

      - name: Compiler le nouveau modele ORANGE
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verifier l APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERREUR : APK introuvable ou vide."
            exit 1
          fi

          echo "APK genere :"
          ls -lh "$APK"

          echo ""
          echo "Verification du logo dans l APK..."

          unzip -l "$APK" | grep -qi "fasso_logo_orange"

          echo "Verification des photos dans l APK..."

          unzip -l "$APK" | grep -qi "tondeuse"
          unzip -l "$APK" | grep -qi "fer_repasser"
          unzip -l "$APK" | grep -qi "aspirateur_voiture"
          unzip -l "$APK" | grep -qi "compresseur"

          echo ""
          echo "========================================"
          echo "APK ORANGE VERIFIE AVEC LOGO ET PHOTOS"
          echo "========================================"

      - name: Publier APK ORANGE FINAL
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-ORANGE-FINAL-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
