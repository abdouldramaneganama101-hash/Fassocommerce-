name: Build Fasso Commerce APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler Fasso Commerce
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Vérifier la structure du projet
        shell: bash
        run: |
          set -e

          echo "===== STRUCTURE DU PROJET ====="
          ls -la

          echo "===== VERIFICATION ANDROID ====="

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERREUR : settings.gradle(.kts) introuvable."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERREUR : app/build.gradle(.kts) introuvable."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          if [ ! -f "./gradlew" ]; then
            echo "ERREUR : Gradle Wrapper gradlew introuvable."
            exit 1
          fi

          echo "Projet Android correctement détecté."

      - name: Préparer Gradle Wrapper
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --version

      - name: Vérifier Android SDK déjà disponible
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ERREUR : Android SDK introuvable sur le runner."
            exit 1
          fi

          if [ -n "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          else
            SDK="$ANDROID_SDK_ROOT"
          fi

          echo "SDK utilisé : $SDK"

          echo "===== PLATEFORMES ANDROID DISPONIBLES ====="
          ls -la "$SDK/platforms" 2>/dev/null || true

          echo "===== BUILD TOOLS DISPONIBLES ====="
          ls -la "$SDK/build-tools" 2>/dev/null || true

      - name: Nettoyer le projet
        shell: bash
        run: |
          set -e
          ./gradlew clean --no-daemon

      - name: Compiler Fasso Commerce
        shell: bash
        run: |
          set -e

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Vérifier l'APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERREUR : APK vide."
            exit 1
          fi

          echo "======================================"
          echo " FASSO COMMERCE APK GENERE AVEC SUCCES"
          echo "======================================"

          ls -lh "$APK"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
