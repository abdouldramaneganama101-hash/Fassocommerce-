name: Build Fasso Commerce - Test complet

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Vérifier les fichiers disponibles
        run: |
          echo "===== ZIP DISPONIBLES ====="
          find . -maxdepth 1 -type f -iname "*.zip" -print

      - name: Sélectionner le nouveau projet
        run: |
          set -e

          ZIP="Fasso-Commerce-ACCUEIL-ADMIN.zip"

          echo "===== ZIP À COMPILER ====="
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERREUR : le fichier $ZIP est introuvable."
            exit 1
          fi

          rm -rf /tmp/fasso_project
          mkdir -p /tmp/fasso_project

          unzip -q "$ZIP" -d /tmp/fasso_project

          SETTINGS=$(find /tmp/fasso_project \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : projet Android introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet trouvé : $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERREUR : dossier app introuvable."
            exit 1
          fi

          echo "===== VÉRIFICATION MAIN ACTIVITY ====="

          if [ ! -f "$PROJECT_DIR/app/src/main/java/com/fassocommerce/MainActivity.java" ]; then
            echo "ERREUR : MainActivity.java introuvable."
            exit 1
          fi

          echo "===== VÉRIFICATION ADMINISTRATION ====="

          if [ ! -f "$PROJECT_DIR/app/src/main/java/com/fassocommerce/AdminActivity.java" ]; then
            echo "ERREUR : AdminActivity.java introuvable."
            exit 1
          fi

          echo "===== VÉRIFICATION LOGO ====="

          if [ ! -f "$PROJECT_DIR/app/src/main/res/drawable/fasso_logo.png" ]; then
            echo "ERREUR : fasso_logo.png introuvable."
            exit 1
          fi

          echo "===== VÉRIFICATION MANIFEST ====="

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          echo "===== PROJET VALIDÉ ====="
          echo "Accueil : OK"
          echo "Administration : OK"
          echo "Logo : OK"

          rm -rf /tmp/final_fasso_project
          cp -a "$PROJECT_DIR" /tmp/final_fasso_project

      - name: Vérification finale avant compilation
        run: |
          set -e

          cd /tmp/final_fasso_project

          echo "===== FICHIERS DE L'APPLICATION ====="
          find app/src/main -type f | sort

          echo "===== LOGO ====="
          ls -lh app/src/main/res/drawable/fasso_logo.png

          echo "===== ADMINISTRATION ====="
          ls -lh app/src/main/java/com/fassocommerce/AdminActivity.java

      - name: Compiler l'APK
        run: |
          set -e

          cd /tmp/final_fasso_project

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Vérifier l'APK final
        run: |
          set -e

          APK="/tmp/final_fasso_project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK non généré."
            exit 1
          fi

          echo "===== APK FINAL ====="
          ls -lh "$APK"
          echo "APK généré avec succès."

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-ACCUEIL-ADMIN-debug
          path: /tmp/final_fasso_project/app/build/outputs/apk/debug/app-debug.apk
