name: Build Fasso Commerce V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Installer Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Trouver le ZIP Fasso Commerce V2.1
        run: |
          echo "Fichiers disponibles :"
          find . -maxdepth 3 -type f | sort

          ZIP=$(find . -type f \
            -name 'Fasso-Commerce-ORANGE-V2.1-PAIEMENT-ORANGE*.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP V2.1 introuvable."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Décompresser le projet
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo "Contenu après décompression :"
          find android-project -maxdepth 4 -type f | sort

      - name: Détecter le vrai dossier Android
        run: |
          PROJECT_DIR=""

          if [ -f "android-project/settings.gradle.kts" ]; then
            PROJECT_DIR="android-project"
          elif [ -f "android-project/settings.gradle" ]; then
            PROJECT_DIR="android-project"
          else
            SETTINGS=$(find android-project -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERREUR : settings.gradle.kts introuvable."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "Projet Android détecté : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Vérifier le projet
        run: |
          echo "Dossier projet : $PROJECT_DIR"
          echo "build.gradle.kts :"
          test -f "$PROJECT_DIR/build.gradle.kts" || {
            echo "ERREUR : build.gradle.kts introuvable."
            exit 1
          }

          echo "app/build.gradle.kts :"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || {
            echo "ERREUR : app/build.gradle.kts introuvable."
            exit 1
          }

          echo "Projet vérifié."

      - name: Compiler Fasso Commerce
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          gradle clean
          gradle :app:assembleDebug --stacktrace

      - name: Vérifier APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK non généré."
            find "$PROJECT_DIR/app/build" -type f | sort || true
            exit 1
          fi

          echo "APK généré avec succès : $APK"
          ls -lh "$APK"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-V2.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
