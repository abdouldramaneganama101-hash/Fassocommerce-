name: Build Fasso Commerce

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier Java
        run: java -version

      - name: Préparer Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Vérifier les fichiers du projet
        run: |
          echo "Contenu du dépôt :"
          ls -la
          echo "Contenu de app :"
          ls -la app || true

      - name: Donner les droits à Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compiler l'APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean :app:assembleDebug --stacktrace
          else
            echo "ERREUR : gradlew introuvable."
            exit 1
          fi

      - name: Vérifier l'APK
        run: |
          echo "APK généré :"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-V2.2-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
