name: Build Fasso Commerce V1.9

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Installer Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Vérifier les fichiers ZIP
        run: |
          echo "===== FICHIERS ZIP FASSO V1.9 ====="
          find . -maxdepth 3 -type f -name "Fasso-Commerce-ORANGE-V1.9-DEFILLEMENT-CORRIGE*.zip" -print

      - name: Préparer le projet Android
        run: |
          ZIP=$(find . -type f -name "Fasso-Commerce-ORANGE-V1.9-DEFILLEMENT-CORRIGE*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP Fasso V1.9 introuvable."
            exit 1
          fi

          echo "ZIP sélectionné : $ZIP"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo "===== CONTENU DU PROJET ====="
          find android-project -maxdepth 3 -type f | head -100

      - name: Vérifier Gradle
        working-directory: android-project
        run: |
          echo "===== VERSION GRADLE ====="
          gradle --version
          echo "===== STRUCTURE ====="
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

      - name: Nettoyer le projet
        working-directory: android-project
        run: |
          gradle clean

      - name: Compiler l'APK
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: |
          echo "===== APK GÉNÉRÉ ====="
          find android-project/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-V1.9-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
