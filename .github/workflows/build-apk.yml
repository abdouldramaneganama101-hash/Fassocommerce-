name: Build Fasso Commerce APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler Fasso Commerce
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Vérifier le projet Android
        shell: bash
        run: |
          set -e

          echo "=== CONTENU DU DEPOT ==="
          ls -la

          echo "=== VERIFICATION ==="

          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Projet Android trouvé."

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Préparer Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERREUR : gradlew est absent."
            echo "Le Gradle Wrapper doit être présent dans le projet."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Nettoyer le projet
        shell: bash
        run: |
          set -e
          ./gradlew clean --no-daemon

      - name: Compiler Fasso Commerce
        shell: bash
        run: |
          set -e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Vérifier l'APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERREUR : app-debug.apk n'a pas été généré."
            exit 1
          fi

          echo "================================"
          echo "APK FASSO COMMERCE GENERE"
          echo "================================"

          ls -lh "$APK"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
