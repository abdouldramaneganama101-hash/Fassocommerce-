name: Build Fasso Commerce APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Construire l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Installer Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verifier Android SDK
        shell: bash
        run: |
          echo "=== SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | grep "platforms;android-36" || true
          sdkmanager --list_installed | grep "build-tools;36.0.0" || true

      - name: Verifier la structure du projet
        shell: bash
        run: |
          echo "=== RACINE ==="
          ls -la
          echo "=== DOSSIER APP ==="
          ls -la app
          echo "=== BUILD GRADLE ==="
          cat app/build.gradle.kts
          echo "=== SETTINGS ==="
          cat settings.gradle.kts

      - name: Installer Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Verifier Gradle
        run: gradle --version

      - name: Nettoyer le projet
        run: gradle clean --no-daemon

      - name: Construire APK Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verifier APK
        shell: bash
        run: |
          echo "=== APK GENERE ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERREUR : APK non trouve"
            exit 1
          fi

          echo "SUCCES : APK trouve"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-APK
          path: app/build/outputs/apk/debug/app-debug.apk
