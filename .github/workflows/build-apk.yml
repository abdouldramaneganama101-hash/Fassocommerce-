name: Build Fasso Commerce APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Construire l APK
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Installer Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verifier la structure du projet
        shell: bash
        run: |
          echo "=== RACINE DU DEPOT ==="
          ls -la

          echo "=== VERIFICATION APP ==="
          if [ ! -d "app" ]; then
            echo "ERREUR : le dossier app est absent de la racine."
            echo "Le projet Android doit contenir app/ a la racine."
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERREUR : settings.gradle.kts absent."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERREUR : build.gradle.kts absent."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERREUR : app/build.gradle.kts absent."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERREUR : AndroidManifest.xml absent."
            exit 1
          fi

          echo "Projet Android correctement detecte."

      - name: Installer Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Verifier Gradle
        run: gradle --version

      - name: Nettoyer le projet
        run: gradle clean --no-daemon

      - name: Construire APK Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verifier APK
        shell: bash
        run: |
          echo "=== APK GENERE ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERREUR : APK non trouve."
            exit 1
          fi

          echo "SUCCES : APK trouve."
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-APK
          path: app/build/outputs/apk/debug/app-debug.apk
