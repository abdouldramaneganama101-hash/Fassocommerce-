
name: Build Fasso Commerce V2.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Préparer Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Repérer le projet Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "fasso/settings.gradle.kts" ] && [ -f "fasso/app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=fasso" >> "$GITHUB_ENV"
          else
            echo "ERREUR : fichiers Gradle introuvables."
            echo "Vérifie que settings.gradle.kts et app/build.gradle.kts sont présents."
            find . -maxdepth 4 \( -name settings.gradle.kts -o -name build.gradle.kts \) -print
            exit 1
          fi

      - name: Compiler l'APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Vérifier l'APK généré
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-V2.4-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
