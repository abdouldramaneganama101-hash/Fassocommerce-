name: Build Fasso Commerce

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Préparer le bon projet
        run: |
          set -e

          ZIP="Fasso-Commerce-ADMIN-LOGO.zip"

          echo "Recherche du fichier : $ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERREUR : $ZIP est introuvable."
            echo "Fichiers ZIP disponibles :"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          rm -rf /tmp/fasso_project
          mkdir -p /tmp/fasso_project

          unzip -q "$ZIP" -d /tmp/fasso_project

          echo "Recherche du projet Android..."

          SETTINGS=$(find /tmp/fasso_project -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle.kts introuvable."
            find /tmp/fasso_project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet trouvé dans : $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERREUR : dossier app introuvable."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/java/com/fassocommerce/MainActivity.java" ]; then
            echo "ERREUR : MainActivity.java introuvable."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/java/com/fassocommerce/AdminActivity.java" ]; then
            echo "ERREUR : AdminActivity.java introuvable."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/res/drawable/fasso_logo.png" ]; then
            echo "ERREUR : logo fasso_logo.png introuvable."
            exit 1
          fi

          echo "Projet correct confirmé."
          echo "Logo confirmé."
          echo "Administration confirmée."

          rm -rf /tmp/final_fasso_project
          cp -a "$PROJECT_DIR" /tmp/final_fasso_project

      - name: Vérifier le projet
        run: |
          set -e

          cd /tmp/final_fasso_project

          echo "===== STRUCTURE ====="
          find app/src/main -maxdepth 5 -type f | sort

          echo "===== LOGO ====="
          ls -lh app/src/main/res/drawable/fasso_logo.png

          echo "===== ADMINISTRATION ====="
          ls -lh app/src/main/java/com/fassocommerce/AdminActivity.java

      - name: Compiler l'APK
        run: |
          set -e

          cd /tmp/final_fasso_project

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Vérifier l'APK
        run: |
          set -e

          APK="/tmp/final_fasso_project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK non généré."
            exit 1
          fi

          echo "APK généré avec succès :"
          ls -lh "$APK"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-ADMIN-LOGO-debug
          path: /tmp/final_fasso_project/app/build/outputs/apk/debug/app-debug.apk
