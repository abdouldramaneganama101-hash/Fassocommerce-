name: Fasso Commerce - V1.7 FINAL

on:
  workflow_dispatch:

jobs:
  build:
    name: Construire Fasso Commerce V1.7
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Installer Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Selectionner UNIQUEMENT le ZIP V1.7
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche du ZIP V1.7..."

          ZIP="$(find . -maxdepth 1 -type f \
            -iname 'Fasso-Commerce-ORANGE-V1.7-ICONE-CORRIGEE*.zip' \
            -print | sort -V | tail -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP V1.7 introuvable."
            echo ""
            echo "ZIP disponibles :"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "========================================"
          echo "ZIP V1.7 SELECTIONNE :"
          echo "$ZIP"
          echo "========================================"

          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

      - name: Trouver la racine Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f android-project/settings.gradle.kts ]; then
            echo "Projet Android trouve."
          else
            ROOT="$(find android-project -mindepth 1 -maxdepth 1 -type d \
              -exec test -f '{}/settings.gradle.kts' \; -print | head -n 1)"

            if [ -z "$ROOT" ]; then
              echo "ERREUR : projet Android introuvable."
              find android-project -maxdepth 4 -type f -print
              exit 1
            fi

            TEMP_DIR="android-project-temp"
            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            cp -a "$ROOT"/. "$TEMP_DIR"/
            rm -rf android-project
            mv "$TEMP_DIR" android-project
          fi

      - name: Verifier le projet V1.7
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/fassocommerce/MainActivity.java
          test -f app/src/main/java/com/fassocommerce/AdminActivity.java
          test -f app/src/main/java/com/fassocommerce/ProductStore.java
          test -f app/src/main/java/com/fassocommerce/OrderStore.java

          echo "========================================"
          echo "PROJET V1.7 VERIFIE"
          echo "========================================"

      - name: Installer Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Afficher les versions
        run: |
          java -version
          gradle --version

      - name: Nettoyer
        working-directory: android-project
        run: |
          gradle clean --no-daemon

      - name: Compiler APK V1.7
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verifier APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERREUR : APK introuvable ou vide."
            exit 1
          fi

          echo "========================================"
          echo "APK V1.7 GENERE AVEC SUCCES"
          echo "========================================"

          ls -lh "$APK"

      - name: Publier APK V1.7
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-V1.7-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
