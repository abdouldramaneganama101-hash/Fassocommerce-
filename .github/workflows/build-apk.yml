name: Build Fasso Commerce V2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Vérifier le ZIP V2.0
        run: |
          echo "===== RECHERCHE DU PROJET V2.0 ====="
          find . -type f -name 'Fasso-Commerce-ORANGE-V2.0-GESTION-PRODUITS*.zip'

      - name: Préparer le projet Android
        run: |
          ZIP=$(find . -type f -name 'Fasso-Commerce-ORANGE-V2.0-GESTION-PRODUITS*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP V2.0 introuvable."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          rm -rf android-project
          mkdir android-project

          unzip -q "$ZIP" -d android-project

          echo "===== CONTENU DU PROJET ====="
          find android-project -maxdepth 3 -type f | sort

      - name: Trouver la racine Android
        run: |
          if [ -f "android-project/settings.gradle.kts" ]; then
            echo "Projet trouvé à la racine du ZIP."
          elif [ -f "android-project/Fasso-Commerce/settings.gradle.kts" ]; then
            echo "Projet trouvé dans android-project/Fasso-Commerce."
            mv android-project/Fasso-Commerce/* android-project/
            rm -rf android-project/Fasso-Commerce
          else
            echo "Recherche automatique du settings.gradle.kts..."
            SETTINGS=$(find android-project -name settings.gradle.kts -type f | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERREUR : settings.gradle.kts introuvable."
              exit 1
            fi

            ROOT=$(dirname "$SETTINGS")

            if [ "$ROOT" != "android-project" ]; then
              cp -r "$ROOT"/. android-project/
            fi
          fi

          echo "===== RACINE FINALE ====="
          ls -la android-project

      - name: Vérifier la structure Android
        run: |
          test -f android-project/settings.gradle.kts
          test -f android-project/build.gradle.kts
          test -f android-project/app/build.gradle.kts

          echo "Structure Android OK."

      - name: Compiler l'APK V2.0
        working-directory: android-project
        run: |
          gradle --version
          gradle clean
          gradle :app:assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: |
          echo "===== APK GÉNÉRÉ ====="
          find android-project/app/build/outputs/apk -type f -name "*.apk" -print

          test -f android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasso-Commerce-V2.0-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
